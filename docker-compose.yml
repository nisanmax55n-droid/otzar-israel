services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: otzar_israel
      POSTGRES_USER: otzar
      POSTGRES_PASSWORD: otzar
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://otzar:otzar@db:5432/otzar_israel
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes: {pgdata: {}}
